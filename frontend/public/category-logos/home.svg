<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-home" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="roof-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="wall-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="door-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sprout-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="shadow-home" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Badge with Rounded Corners -->
  <rect width="128" height="128" rx="28" fill="url(#bg-home)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
  
  <g filter="url(#shadow-home)">
    <!-- Sun Glow behind roof -->
    <circle cx="86" cy="38" r="14" fill="#FEF08A" opacity="0.85" />
    <circle cx="86" cy="38" r="18" fill="#FDE047" opacity="0.35" />

    <!-- Chimney -->
    <rect x="76" y="36" width="10" height="18" rx="2" fill="#991B1B" stroke="#7F1D1D" stroke-width="1" />
    <!-- Smoke puff -->
    <circle cx="81" cy="30" r="3" fill="#FFFFFF" opacity="0.6" />
    <circle cx="83" cy="24" r="4" fill="#FFFFFF" opacity="0.4" />

    <!-- House Base Wall -->
    <rect x="34" y="56" width="60" height="42" rx="4" fill="url(#wall-gradient)" stroke="#D97706" stroke-width="1.5" />

    <!-- Pitched Roof -->
    <path d="M26 58 L64 26 L102 58 Z" fill="url(#roof-gradient)" stroke="#991B1B" stroke-width="2" stroke-linejoin="round" />
    <!-- Roof highlight ridge -->
    <path d="M30 57 L64 28 L98 57" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" />

    <!-- Cozy Farm Attic Window (Circular) -->
    <circle cx="64" cy="46" r="6.5" fill="#FEF08A" stroke="#78350F" stroke-width="1.5" />
    <line x1="64" y1="39.5" x2="64" y2="52.5" stroke="#78350F" stroke-width="1.2" />
    <line x1="57.5" y1="46" x2="70.5" y2="46" stroke="#78350F" stroke-width="1.2" />

    <!-- Arched Welcoming Front Door -->
    <path d="M54 98 V74 C54 68.5 74 68.5 74 74 V98 Z" fill="url(#door-gradient)" stroke="#451A03" stroke-width="1.5" />
    <!-- Door Handle -->
    <circle cx="58" cy="85" r="1.5" fill="#FDE047" />

    <!-- Left & Right Cozy Glowing Windows -->
    <rect x="38" y="66" width="11" height="14" rx="2" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1.2" />
    <line x1="43.5" y1="66" x2="43.5" y2="80" stroke="#1E3A8A" stroke-width="1" />
    <line x1="38" y1="73" x2="49" y2="73" stroke="#1E3A8A" stroke-width="1" />
    <rect x="39" y="67" width="4" height="5" fill="#BFDBFE" opacity="0.7" />

    <rect x="79" y="66" width="11" height="14" rx="2" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1.2" />
    <line x1="84.5" y1="66" x2="84.5" y2="80" stroke="#1E3A8A" stroke-width="1" />
    <line x1="79" y1="73" x2="90" y2="73" stroke="#1E3A8A" stroke-width="1" />
    <rect x="80" y="67" width="4" height="5" fill="#BFDBFE" opacity="0.7" />

    <!-- Green Garden Ground / Grass Patches -->
    <path d="M22 98 C36 94 92 94 106 98 Z" fill="url(#sprout-green)" opacity="0.9" />
    
    <!-- Farm Sprout / Little Plant by the Door -->
    <path d="M30 96 C30 90 24 88 22 92 C24 96 28 96 30 96 Z" fill="#22C55E" />
    <path d="M98 96 C98 90 104 88 106 92 C104 96 100 96 98 96 Z" fill="#22C55E" />
  </g>
</svg>
