<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="gold-cart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <filter id="shadow-cart" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg-cart)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <g filter="url(#shadow-cart)">
    <!-- Cart Structure -->
    <path d="M28 36 H38 L48 76 H90 L98 46 H42" fill="none" stroke="url(#gold-cart)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Produce & Bags in Cart -->
    <circle cx="58" cy="40" r="10" fill="#FBBF24" />
    <circle cx="74" cy="38" r="12" fill="#34D399" />
    <circle cx="88" cy="42" r="8" fill="#F87171" />
    <!-- Grid -->
    <line x1="48" y1="56" x2="94" y2="56" stroke="url(#gold-cart)" stroke-width="2" />
    <line x1="52" y1="66" x2="88" y2="66" stroke="url(#gold-cart)" stroke-width="2" />
    <line x1="60" y1="46" x2="56" y2="76" stroke="url(#gold-cart)" stroke-width="2" />
    <line x1="72" y1="46" x2="70" y2="76" stroke="url(#gold-cart)" stroke-width="2" />
    <line x1="84" y1="46" x2="82" y2="76" stroke="url(#gold-cart)" stroke-width="2" />
    <!-- Wheels -->
    <circle cx="54" cy="88" r="6" fill="#FACC15" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="84" cy="88" r="6" fill="#FACC15" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>
