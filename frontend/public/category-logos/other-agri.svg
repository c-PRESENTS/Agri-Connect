<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-other" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>
    <linearGradient id="sack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="hay-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadow-other" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg-other)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <g filter="url(#shadow-other)">
    <!-- Silo / Biomass Storage Background -->
    <path d="M78 40 C78 34 94 34 94 40 V86 H78 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" />
    <path d="M78 40 C78 32 94 32 94 40 Z" fill="#94A3B8" />
    <!-- Silo Rings -->
    <line x1="78" y1="52" x2="94" y2="52" stroke="#64748B" stroke-width="1" />
    <line x1="78" y1="64" x2="94" y2="64" stroke="#64748B" stroke-width="1" />
    <line x1="78" y1="76" x2="94" y2="76" stroke="#64748B" stroke-width="1" />
    <!-- Round Hay Bale -->
    <ellipse cx="44" cy="74" rx="16" ry="16" fill="url(#hay-grad)" stroke="#78350F" stroke-width="2" />
    <ellipse cx="44" cy="74" rx="10" ry="10" fill="none" stroke="#A16207" stroke-width="1.5" stroke-dasharray="3,3" />
    <ellipse cx="44" cy="74" rx="5" ry="5" fill="none" stroke="#A16207" stroke-width="1.5" />
    <!-- Animal Feed & Silage Sacks in Foreground -->
    <path d="M54 60 C54 56 60 54 64 54 C68 54 74 56 74 60 L78 94 C78 96 68 98 64 98 C60 98 50 96 50 94 Z" fill="url(#sack-grad)" stroke="#78350F" stroke-width="2" />
    <!-- Sack Tie -->
    <ellipse cx="64" cy="60" rx="8" ry="3" fill="#78350F" />
    <!-- Stitched Mark on Sack (Feed protein / grass icon) -->
    <path d="M64 70 V82 M60 74 L64 78 L68 74" stroke="#15803D" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Agro-Commodity Circular Exchange Arrow -->
    <path d="M30 46 A24 24 0 0 1 68 34" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <polygon points="68,30 74,35 68,40" fill="#FEF08A" />
  </g>
</svg>
