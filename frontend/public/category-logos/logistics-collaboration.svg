<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lcollab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="hands-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow-lcollab" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg-lcollab)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <g filter="url(#shadow-lcollab)">
    <!-- Supply Chain Route Network Nodes Behind Handshake -->
    <circle cx="34" cy="40" r="5" fill="#5EEAD4" />
    <circle cx="94" cy="40" r="5" fill="#5EEAD4" />
    <circle cx="64" cy="94" r="5" fill="#5EEAD4" />
    <line x1="34" y1="40" x2="64" y2="94" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="94" y1="40" x2="64" y2="94" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="34" y1="40" x2="94" y2="40" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    <!-- Center Handshake Partnership Icon -->
    <path d="M30 62 L48 48 L62 58 L76 48 L98 62 L88 74 L78 68 L68 76 L54 66 L40 76 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <!-- Clasping Hands Detail -->
    <path d="M50 56 L64 68 L78 56" stroke="url(#hands-gold)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M54 62 L64 72 L74 62" stroke="url(#hands-gold)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Transport Truck Emblem Center -->
    <circle cx="64" cy="67" r="9" fill="#14B8A6" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M60 65 H66 L68 68 V70 H60 Z" fill="#FFFFFF" />
    <circle cx="62" cy="71" r="1.5" fill="#0F172A" />
    <circle cx="66" cy="71" r="1.5" fill="#0F172A" />
  </g>
</svg>
